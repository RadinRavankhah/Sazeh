[project]
name = "sazeh-backend"
version = "0.1.0"
description = "Sazeh v2 - Agentic website builder platform"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.2",
    "djangorestframework>=3.15,<4",
    "django-cors-headers>=4.5,<5",
    "django-allauth>=0.63,<1",
    "dj-database-url>=2.1,<3",
    "drf-nested-routers>=0.93,<1",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.4,<6",
    "redis>=5.2,<6",
    "pydantic-settings>=2.6,<3",
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "boto3>=1.36,<2",
    "httpx>=0.28,<1",
    "django-filter>=25.0,<26",
    "uvicorn[standard]>=0.33,<1",
    "openai>=1.60,<3",
    "structlog>=25.1,<26",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
